[workspace]
resolver = "3"
members = [".", "aula/proto", "aula/storage", "aula/server", "aula/ui", "aula/tutorial"]
# Built by cargo-fuzz with nightly; see fuzz/README.md.
exclude = ["fuzz"]

[workspace.package]
version = "0.4.4"
edition = "2024"
license = "MIT"
authors = ["Thiago Massari Guedes"]

[workspace.dependencies]
expressa = { path = "." }
expressa-aula-proto = { path = "aula/proto" }
expressa-aula-storage = { path = "aula/storage" }
tonic = "0.13"
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-stream = "0.1"
tonic-build = "0.13"
prost-types = "0.13"

# Remaining embedding and error-layout debts are tracked in
# lang-tasks/027-execution-configuration.md and lang-tasks/032-public-api-and-ast-layout.md.
# Allowed so CI can deny the rest.
[workspace.lints.clippy]
too_many_arguments = "allow"
result_large_err = "allow"
large_enum_variant = "allow"
type_complexity = "allow"

# Default `cargo build --release` keeps Cargo's usual settings (faster to
# compile). For lab PCs: `cargo build --profile release-lto`.
[profile.release-lto]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[package]
name = "expressa"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
rustyline = "15"
rust_decimal = "1"
minifb = "0.28"
png = "0.17"
stacker = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "expressa-grafico"
path = "src/bin/expressa-grafico.rs"
