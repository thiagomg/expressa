[workspace]
resolver = "3"
members = [".", "aula/proto", "aula/storage", "aula/server", "aula/ui", "aula/ui-freya", "aula/tutorial", "aula/tree-sitter-expressa"]
# Built by cargo-fuzz with nightly; see fuzz/README.md.
exclude = ["fuzz"]

[workspace.package]
version = "0.4.2"
edition = "2024"
license = "MIT"
authors = ["Thiago Massari Guedes"]

[workspace.dependencies]
expressa = { path = "." }
expressa-aula-proto = { path = "aula/proto" }
expressa-aula-storage = { path = "aula/storage" }
tonic = "0.13"
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-stream = "0.1"
tonic-build = "0.13"
prost-types = "0.13"

# Design debts tracked in ajustes/03-estrutura-do-interpretador.md (builder
# instead of the run_* functions, boxed errors). Allowed so CI can deny the rest.
[workspace.lints.clippy]
too_many_arguments = "allow"
result_large_err = "allow"
large_enum_variant = "allow"
type_complexity = "allow"

# bindgen 0.73 allows syn 3, but prettyplease 0.2 still speaks syn 2.
# serde_derive 1.0.229 pulls syn 3 into the workspace; pin bindgen to syn 2.
[patch.crates-io]
bindgen = { path = "vendor/bindgen" }

[package]
name = "expressa"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
rustyline = "15"
rust_decimal = "1"
minifb = "0.28"
png = "0.17"
stacker = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "expressa-grafico"
path = "src/bin/expressa-grafico.rs"
