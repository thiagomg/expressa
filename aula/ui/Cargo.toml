[package]
name = "expressa-aula"
version.workspace = true
edition.workspace = true
publish = false
description = "Editor GTK da Expressa Aula (roda os programas; o servidor guarda os arquivos)"

[dependencies]
expressa = { workspace = true }
expressa-aula-proto = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
gtk = { version = "0.9", package = "gtk4", features = ["v4_6"] }
sourceview5 = { version = "0.9", features = ["v5_4"] }
gdk-pixbuf = "0.20"
libc = "0.2"
