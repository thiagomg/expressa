syntax = "proto3";

package expressa.aula;

// Student files under {root}/{student}/. Identity is a folder name, not a UUID.

service Turma {
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
}

service Runner {
  // Interactive: first client message is `start`, later messages are
  // replies to `leia`. Server sends stdout, leia prompts, then finished.
  rpc Exec(stream ExecIn) returns (stream ExecOut);
}

message ListFilesRequest {
  string student = 1;
}

message TreeEntry {
  // Path relative to the student folder, e.g. "lib" or "lib/mat.lep".
  string path = 1;
  bool is_dir = 2;
}

message ListFilesResponse {
  repeated TreeEntry entries = 1;
}

message ReadFileRequest {
  string student = 1;
  string path = 2;
}

message ReadFileResponse {
  string source = 1;
}

message WriteFileRequest {
  string student = 1;
  string path = 2;
  string source = 3;
}

message WriteFileResponse {}

message DeleteFileRequest {
  string student = 1;
  string path = 2;
}

message DeleteFileResponse {}

message RunRequest {
  string student = 1;
  string path = 2;
  // If empty, the file is read from disk.
  string source = 3;
  bool debug = 4;
  repeated uint32 breakpoint_lines = 5;
  repeated string args = 6;
}

message ExecIn {
  oneof payload {
    RunRequest start = 1;
    string line = 2;
    // continuar | proximo | entrar | sair | terminar | ponto N | remover N
    string debug_cmd = 3;
  }
}

message DebugVar {
  string scope = 1;
  string name = 2;
  string value = 3;
}

message DebugFrame {
  string name = 1;
  string file = 2;
  uint32 line = 3;
}

message DebugPaused {
  string file = 1;
  uint32 line = 2;
  uint32 col = 3;
  string source_line = 4;
  repeated DebugVar vars = 5;
  repeated DebugFrame stack = 6;
}

message ExecOut {
  oneof payload {
    string stdout = 1;
    // Same text as CLI `<<<EXPRESSA-LEIA>>>{prompt}` — the prompt only.
    string leia_prompt = 2;
    ExecFinished finished = 3;
    DebugPaused paused = 4;
    string stderr = 5;
  }
}

message ExecFinished {
  bool ok = 1;
  string error_message = 2;
  string error_file = 3;
  uint32 error_line = 4;
  uint32 error_col = 5;
}
