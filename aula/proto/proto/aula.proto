syntax = "proto3";

package expressa.aula;

// Student files under {root}/{student}/. Identity is a folder name, not a UUID.
// The server only stores files; the editor runs and debugs programs itself.

service Turma {
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  rpc Mkdir(MkdirRequest) returns (MkdirResponse);
  rpc Rename(RenameRequest) returns (RenameResponse);
}

message ListFilesRequest {
  string student = 1;
}

message TreeEntry {
  // Path relative to the student folder, e.g. "lib" or "lib/mat.lep".
  string path = 1;
  bool is_dir = 2;
}

message ListFilesResponse {
  repeated TreeEntry entries = 1;
}

message ReadFileRequest {
  string student = 1;
  string path = 2;
}

message ReadFileResponse {
  string source = 1;
}

message WriteFileRequest {
  string student = 1;
  string path = 2;
  string source = 3;
}

message WriteFileResponse {}

message DeleteFileRequest {
  string student = 1;
  string path = 2;
}

message DeleteFileResponse {}

message MkdirRequest {
  string student = 1;
  string path = 2;
}

message MkdirResponse {}

message RenameRequest {
  string student = 1;
  string from = 2;
  string to = 3;
}

message RenameResponse {}
