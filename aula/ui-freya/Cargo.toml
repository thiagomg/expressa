[package]
name = "expressa-aula-freya"
version.workspace = true
edition.workspace = true
publish = false
description = "Editor Freya da Expressa Aula (em paralelo ao GTK)"

[lints]
workspace = true

[[bin]]
name = "expressa-aula-freya"
path = "src/main.rs"

[dependencies]
expressa = { workspace = true }
tree-sitter-expressa = { path = "../tree-sitter-expressa" }
freya = { version = "0.5", features = ["code-editor"] }
dirs = "6"
rfd = "0.17"
tokio = { workspace = true, features = ["time"] }
