name: Project storage

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  storage:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p expressa-aula-storage --locked
      - run: cargo clippy -p expressa-aula-storage --all-targets --locked -- -D warnings
