[package]
name = "expressa-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
expressa = { path = ".." }

# Separate from the main workspace: cargo-fuzz builds with nightly and
# sanitizer flags of its own.
[workspace]
members = ["."]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "executar"
path = "fuzz_targets/executar.rs"
test = false
doc = false
bench = false
